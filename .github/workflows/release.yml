name: Build Amit

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:

  # ==========================================================
  # WINDOWS
  # ==========================================================

  windows:
    name: Windows Build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows
        run: npm run dist:win -- --publish never

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/
          if-no-files-found: error


  # ==========================================================
  # LINUX
  # ==========================================================

  linux:
    name: Linux Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux
        run: npm run dist:linux -- --publish never

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist/
          if-no-files-found: error


  # ==========================================================
  # MACOS
  # ==========================================================

  macos:
    name: macOS Build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS
        run: npm run dist:mac -- --publish never

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: dist/
          if-no-files-found: error


  # ==========================================================
  # CREATE & PUBLISH GITHUB RELEASE
  # ==========================================================

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    needs:
      - windows
      - linux
      - macos

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Download Windows artifacts
      # ------------------------------------------------------

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: release-assets/windows

      # ------------------------------------------------------
      # Download Linux artifacts
      # ------------------------------------------------------

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux-dist
          path: release-assets/linux

      # ------------------------------------------------------
      # Download macOS artifacts
      # ------------------------------------------------------

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: macos-dist
          path: release-assets/macos

      # ------------------------------------------------------
      # Show generated files
      # ------------------------------------------------------

      - name: Show release files
        shell: bash
        run: |
          echo "======================================"
          echo "Generated release files:"
          echo "======================================"

          find release-assets \
            -type f \
            -maxdepth 3 \
            -print

      # ------------------------------------------------------
      # Create and publish GitHub Release
      # ------------------------------------------------------

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          echo "Publishing GitHub Release: $TAG_NAME"

          gh release create "$TAG_NAME" \
            release-assets/windows/* \
            release-assets/linux/* \
            release-assets/macos/* \
            --repo "${{ github.repository }}" \
            --title "Amit ${TAG_NAME#v}" \
            --generate-notes \
            --verify-tag

          echo "======================================"
          echo "GitHub Release published successfully."
          echo "======================================"