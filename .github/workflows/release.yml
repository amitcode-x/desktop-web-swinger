name: Build Amit

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows Build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows
        run: npm run dist:win -- --publish never

      - name: Show Windows build files
        shell: pwsh
        run: |
          Write-Host "Windows dist files:"
          Get-ChildItem -Path dist -Force | Select-Object Name, Length, Mode

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/
          if-no-files-found: error


  linux:
    name: Linux Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux
        run: npm run dist:linux -- --publish never

      - name: Show Linux build files
        shell: bash
        run: |
          echo "Linux dist files:"
          find dist -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist/
          if-no-files-found: error


  macos:
    name: macOS Build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS
        run: npm run dist:mac -- --publish never

      - name: Show macOS build files
        shell: bash
        run: |
          echo "macOS dist files:"
          find dist -maxdepth 1 -type f -print | sort

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: dist/
          if-no-files-found: error


  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    needs:
      - windows
      - linux
      - macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: release-assets/windows

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux-dist
          path: release-assets/linux

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: macos-dist
          path: release-assets/macos

      - name: Show release files
        shell: bash
        run: |
          echo "=========================================="
          echo "Release files"
          echo "=========================================="

          echo ""
          echo "Windows:"
          find release-assets/windows \
            -mindepth 1 \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' | sort

          echo ""
          echo "Linux:"
          find release-assets/linux \
            -mindepth 1 \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' | sort

          echo ""
          echo "macOS:"
          find release-assets/macos \
            -mindepth 1 \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' | sort

          echo ""
          echo "=========================================="

      - name: Prepare release assets
        shell: bash
        run: |
          set -e

          mkdir -p release-assets/final

          find release-assets/windows \
            -mindepth 1 \
            -maxdepth 1 \
            -type f \
            -exec cp -f {} release-assets/final/ \;

          find release-assets/linux \
            -mindepth 1 \
            -maxdepth 1 \
            -type f \
            -exec cp -f {} release-assets/final/ \;

          find release-assets/macos \
            -mindepth 1 \
            -maxdepth 1 \
            -type f \
            -exec cp -f {} release-assets/final/ \;

          echo "Final release assets:"
          find release-assets/final \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' | sort

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Publishing GitHub Release: $TAG_NAME"
          echo "=========================================="

          # Remove an old partial/failed release for the same tag.
          # This does NOT delete the Git tag.
          if gh release view "$TAG_NAME" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Existing release found for $TAG_NAME."
            echo "Deleting old release before creating a clean one..."

            gh release delete "$TAG_NAME" \
              --repo "${{ github.repository }}" \
              --yes
          else
            echo "No existing release found for $TAG_NAME."
          fi

          echo ""
          echo "Final assets to upload:"
          find release-assets/final \
            -maxdepth 1 \
            -type f \
            -printf '%p\n' | sort

          echo ""
          echo "Creating GitHub Release..."

          mapfile -d '' ASSETS < <(
            find release-assets/final \
              -mindepth 1 \
              -maxdepth 1 \
              -type f \
              -print0
          )

          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "ERROR: No release assets found."
            exit 1
          fi

          gh release create "$TAG_NAME" \
            "${ASSETS[@]}" \
            --repo "${{ github.repository }}" \
            --title "Amit ${TAG_NAME#v}" \
            --generate-notes \
            --verify-tag \
            --latest

          echo ""
          echo "=========================================="
          echo "GitHub Release published successfully."
          echo "=========================================="